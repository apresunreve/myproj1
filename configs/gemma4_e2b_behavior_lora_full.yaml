project_name: kabr-gemma4-e2b-behavior-lora-full
seed: 42

data:
  train_file: data/processed/kabr_behavior_train_kabr_files2.jsonl
  val_file: data/processed/kabr_behavior_val_cleaned.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 4
  max_train_samples:
  max_val_samples:

model:
  name: google/gemma-4-E2B-it
  processor_id:
  adapter_path:
  max_frames: 4
  precision: bf16
  prompt_mode: label
  output_format: plain

training:
  output_dir: artifacts/runs/gemma4_e2b_behavior_lora_full/checkpoint
  method: lora
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 2.0e-4
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  max_seq_length: 4096
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_strategy: steps
  save_steps: 250
  eval_strategy: "no"
  save_total_limit: 2
  logging_steps: 10
  seed: 42
  dry_run: false
