project_name: kabr-vlm-behavior-distill-mlp-alpha70-16frames-eval
seed: 42

data:
  train_file: data/processed/kabr_behavior_train.jsonl
  val_file: data/processed/kabr_behavior_val.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 16
  max_train_samples:
  max_val_samples:

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  processor_id:
  adapter_path: artifacts/runs/qwen25vl3b_behavior_lora_full/checkpoint
  max_frames: 16
  precision: bf16
  prompt_mode: label
  output_format: plain

training:
  output_dir: artifacts/paper/behavior/distill/qwen25vl3b/mlp_alpha70_16frames_eval
  method: distill_mlp
  feature_batch_size: 2
  classifier_type: mlp
  classifier_epochs: 25
  classifier_learning_rate: 1.0e-3
  classifier_weight_decay: 1.0e-4
  classifier_hidden_dim: 256
  classifier_dropout: 0.1
  distill_temperature: 2.0
  distill_alpha: 0.7
  seed: 42
  dry_run: false
