project_name: kabr-vlm-llava-onevision-qwen2-0.5b-behavior-smoke
seed: 42

data:
  train_file: data/processed/kabr_behavior_train.jsonl
  val_file: data/processed/kabr_behavior_val.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 8
  max_train_samples: 1
  max_val_samples: 1

model:
  name: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
  processor_id:
  adapter_path:
  max_frames: 8
  precision: bf16
  prompt_mode: label
  output_format: plain

training:
  output_dir: artifacts/smoke/llava_onevision_qwen2_0_5b_behavior_lora/checkpoint
  method: lora
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 2.0e-4
  gradient_accumulation_steps: 1
  weight_decay: 0.0
  max_seq_length: 2048
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_strategy: epoch
  eval_strategy: epoch
  save_total_limit: 1
  logging_steps: 1
  seed: 42
  dry_run: false
