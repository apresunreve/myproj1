  adapter_path:
  max_frames: 8
  precision: bf16
  prompt_mode: label
  output_format: plain
training:
  output_dir: artifacts/smoke/llava_onevision_qwen2_0_5b_behavior_full_sft_smoke/checkpoint
  method: full
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 5.0e-5
  gradient_accumulation_steps: 4
  weight_decay: 0.0
  max_seq_length: 2048
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_strategy: steps
  save_steps: 25
  eval_strategy: epoch
  save_total_limit: 2
  logging_steps: 10
  seed: 42
  dry_run: false
