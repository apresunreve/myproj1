project_name: kabr-vlm-behavior-full-sft-smoke
seed: 42
data:
  train_file: data/processed/kabr_behavior_train.jsonl
  val_file: data/processed/kabr_behavior_val_cleaned.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 8
  max_train_samples: 32
  max_val_samples: 16
model:
  name: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
