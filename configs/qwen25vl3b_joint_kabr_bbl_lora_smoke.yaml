project_name: joint-kabr-bbl-qwen25vl3b-lora-smoke
seed: 42

data:
  train_file: data/processed/joint_kabr_bbl_behavior_train.jsonl
  val_file: data/processed/joint_kabr_bbl_behavior_val.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 8
  max_train_samples: 80
  max_val_samples: 30

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  processor_id:
  max_frames: 8
  precision: bf16
  prompt_mode: label
  output_format: plain

training:
  output_dir: artifacts/runs/joint/qwen25vl3b_joint_kabr_bbl_lora_smoke/checkpoint
  method: lora
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 2.0e-4
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  max_seq_length: 2048
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_strategy: epoch
  eval_strategy: "no"
  save_total_limit: 1
  logging_steps: 2
  seed: 42
  dry_run: false
  class_weighting: inv_sqrt
  class_sampler: uniform
