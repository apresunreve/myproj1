project_name: baboonland-gemma4-e2b-behavior-lora-smoke
seed: 42

data:
  train_file: data/processed/baboonland_behavior_train_from_joint.jsonl
  val_file: data/processed/baboonland_behavior_val_from_joint.jsonl
  video_root:
  task_mode: action_recognition
  input_type: clip
  max_frames_per_clip: 1
  max_train_samples: 1
  max_val_samples: 1

model:
  name: google/gemma-4-E2B-it
  processor_id:
  adapter_path:
  max_frames: 1
  precision: bf16
  prompt_mode: label
  output_format: plain

training:
  output_dir: artifacts/smoke/baboonland/gemma4_e2b_behavior_lora/checkpoint
  method: lora
  epochs: 1
  batch_size: 1
  eval_batch_size: 1
  learning_rate: 2.0e-4
  gradient_accumulation_steps: 1
  weight_decay: 0.0
  max_seq_length: 1024
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_strategy: epoch
  eval_strategy: "no"
  save_total_limit: 1
  logging_steps: 1
  seed: 42
  dry_run: false
