runs:
  - name: behavior_zero_shot_qwen25vl3b
    task: behavior
    family: vlm
    method: zero-shot
    model: Qwen/Qwen2.5-VL-3B-Instruct
    output_format: plain
    metrics_path: artifacts/full_eval/qwen25vl3b_behavior_clip_val_full.metrics.json
  - name: behavior_zero_shot_qwen25vl7b
    task: behavior
    family: vlm
    method: zero-shot
    model: Qwen/Qwen2.5-VL-7B-Instruct
    output_format: plain
    metrics_path: artifacts/full_eval/qwen25vl7b_behavior_clip_val_full.metrics.json
  - name: behavior_zero_shot_llava_onevision_7b
    task: behavior
    family: vlm
    method: zero-shot
    model: llava-hf/llava-onevision-qwen2-7b-ov-hf
    output_format: plain
    metrics_path: artifacts/full_eval/llava_onevision_qwen2_7b_behavior_clip_val_full.metrics.json
  - name: behavior_x3d_xs
    task: behavior
    family: x3d
    method: supervised
    model: X3D-XS
    output_format: label
    metrics_path: artifacts/x3d_metrics/x3d_xs_behavior_clip.metrics.json
  - name: behavior_x3d_s
    task: behavior
    family: x3d
    method: supervised
    model: X3D-S
    output_format: label
    metrics_path: artifacts/x3d_metrics/x3d_s_behavior_clip.metrics.json
  - name: behavior_x3d_m
    task: behavior
    family: x3d
    method: supervised
    model: X3D-M
    output_format: label
    metrics_path: artifacts/x3d_metrics/x3d_m_behavior_clip.metrics.json
  - name: behavior_lora_qwen25vl3b_plain
    task: behavior
    family: vlm
    method: lora
    model: Qwen/Qwen2.5-VL-3B-Instruct
    output_format: plain
    metrics_path: artifacts/runs/qwen25vl3b_behavior_lora_full/behavior_val_predictions.metrics.json
    training_metrics_path: artifacts/runs/qwen25vl3b_behavior_lora_full/checkpoint/training_metrics.json
    checkpoint_path: artifacts/runs/qwen25vl3b_behavior_lora_full/checkpoint
  - name: species_lora_qwen25vl3b_plain
    task: species
    family: vlm
    method: lora
    model: Qwen/Qwen2.5-VL-3B-Instruct
    output_format: plain
    metrics_path: artifacts/runs/qwen25vl3b_species_lora_full/species_val_predictions.metrics.json
    training_metrics_path: artifacts/runs/qwen25vl3b_species_lora_full/checkpoint/training_metrics.json
    checkpoint_path: artifacts/runs/qwen25vl3b_species_lora_full/checkpoint
