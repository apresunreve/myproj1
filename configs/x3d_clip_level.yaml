AUG:
  ENABLE: false
  NUM_SAMPLE: 1
  AA_TYPE: rand-m9-mstd0.5-inc1
  COLOR_JITTER: 0.4
  INTERPOLATION: bicubic
  RE_PROB: 0.25
  RE_MODE: pixel
  RE_COUNT: 1
  RE_SPLIT: false
BN:
  USE_PRECISE_STATS: true
  NUM_BATCHES_PRECISE: 200
  WEIGHT_DECAY: 0.0
  NORM_TYPE: batchnorm
  NUM_SPLITS: 1
  NUM_SYNC_DEVICES: 1
  GLOBAL_SYNC: false
DATA:
  PATH_TO_DATA_DIR: /home/jhyan/KABR_files/annotation/clip_manifests
  PATH_PREFIX: /home/jhyan/KABR_files/dataset/image
  NUM_FRAMES: 16
  SAMPLING_RATE: 5
  TRAIN_JITTER_SCALES: [300, 400]
  TRAIN_CROP_SIZE: 300
  TEST_CROP_SIZE: 300
  MEAN: [0.45, 0.45, 0.45]
  STD: [0.225, 0.225, 0.225]
  INPUT_CHANNEL_NUM: [3]
  RANDOM_FLIP: true
  INV_UNIFORM_SAMPLE: true
  MULTI_LABEL: false
  ENSEMBLE_METHOD: sum
  REVERSE_INPUT_CHANNEL: true
DATA_LOADER:
  NUM_WORKERS: 8
  PIN_MEMORY: true
DETECTION:
  ENABLE: false
MODEL:
  ARCH: x3d
  MODEL_NAME: X3D
  NUM_CLASSES: 8
  LOSS_FUNC: cross_entropy
  DROPOUT_RATE: 0.5
  FC_INIT_STD: 0.01
  HEAD_ACT: softmax
NUM_GPUS: 1
NUM_SHARDS: 1
OUTPUT_DIR: /home/jhyan/SlowFast/outputs/x3d_kabr_clips
RESNET:
  DEPTH: 50
  NUM_GROUPS: 1
  WIDTH_PER_GROUP: 64
  INPLACE_RELU: true
  STRIDE_1X1: false
  ZERO_INIT_FINAL_BN: true
  ZERO_INIT_FINAL_CONV: false
  TRANS_FUNC: x3d_transform
  NUM_BLOCK_TEMP_KERNEL: [[3], [4], [6], [3]]
  SPATIAL_STRIDES: [[1], [2], [2], [2]]
  SPATIAL_DILATIONS: [[1], [1], [1], [1]]
RNG_SEED: 0
SLOWFAST:
  ALPHA: 8
  BETA_INV: 8
  FUSION_CONV_CHANNEL_RATIO: 2
  FUSION_KERNEL_SZ: 5
SOLVER:
  BASE_LR: 0.05
  LR_POLICY: cosine
  COSINE_END_LR: 0.0
  MAX_EPOCH: 120
  MOMENTUM: 0.9
  NESTEROV: true
  WEIGHT_DECAY: 5.0e-05
  WARMUP_FACTOR: 0.1
  WARMUP_EPOCHS: 35.0
  WARMUP_START_LR: 0.01
  OPTIMIZING_METHOD: sgd
  BASE_LR_SCALE_NUM_SHARDS: true
TASK: ""
TEST:
  ENABLE: false
  DATASET: kabr_clips
  BATCH_SIZE: 8
  CHECKPOINT_FILE_PATH: ""
  CHECKPOINT_TYPE: pytorch
  NUM_ENSEMBLE_VIEWS: 2
  NUM_SPATIAL_CROPS: 1
  NUM_TEMPORAL_CLIPS: []
  SAVE_RESULTS_PATH: clip_level/results.pkl
  SAVE_CLIP_RESULTS_PATH: clip_level/predictions.jsonl
TRAIN:
  ENABLE: true
  DATASET: kabr_clips
  BATCH_SIZE: 8
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  AUTO_RESUME: true
  CHECKPOINT_FILE_PATH: ""
  CHECKPOINT_TYPE: pytorch
  CHECKPOINT_INFLATE: false
  CHECKPOINT_IN_INIT: false
  MIXED_PRECISION: false
TENSORBOARD:
  ENABLE: false
  CLASS_NAMES_PATH: /home/jhyan/KABR_files/annotation/clip_manifests/classes.json
VIS_MASK:
  ENABLE: false
X3D:
  WIDTH_FACTOR: 2.0
  DEPTH_FACTOR: 5.0
  BOTTLENECK_FACTOR: 2.25
  DIM_C5: 2048
  DIM_C1: 12
  SCALE_RES2: false
  BN_LIN5: false
  CHANNELWISE_3x3x3: true
